[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-autopilot"
version = "0.1.0"
description = "Durable runbook agent: dry-run proofs, deterministic blast-radius verifier, human approval gate, crash-safe resume (simulated environment)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Navi Sohi" }]
dependencies = [
  "pydantic>=2.5,<3",
  "pyyaml>=6",
  "opentelemetry-api>=1.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "opentelemetry-sdk>=1.20",
]

[project.scripts]
runbook-autopilot = "runbook_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
