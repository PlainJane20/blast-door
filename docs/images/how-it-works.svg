<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">How Runbook Autopilot works</title>
  <desc id="d">A runbook step is proposed by a planner, proven by a dry run against a simulated environment, and judged by a deterministic verifier that returns allow, needs approval or deny. Approval needs a second person. The write runs with an idempotency key and every transition is checkpointed and audited.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b45309"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="20" fill="#f8fafc"/>

  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">How Runbook Autopilot works</text>
  <text x="600" y="74" text-anchor="middle" font-size="15" fill="#475569">The model proposes. A deterministic verifier decides. A second person approves anything risky.</text>

  <!-- ROW 1 -->
  <g filter="url(#sh)"><rect x="36" y="100" width="250" height="140" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/></g>
  <text x="161" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.5">1  THE RUNBOOK</text>
  <text x="161" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Typed steps</text>
  <text x="161" y="188" text-anchor="middle" font-size="13" fill="#334155">YAML state machine: ids,</text>
  <text x="161" y="207" text-anchor="middle" font-size="13" fill="#334155">tools, depends_on</text>
  <text x="161" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">cycles and unknown tools rejected</text>
  <path d="M290 170H322" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="326" y="100" width="250" height="140" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/></g>
  <text x="451" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" letter-spacing="1.5">2  THE PLANNER</text>
  <text x="451" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Proposes only</text>
  <text x="451" y="188" text-anchor="middle" font-size="13" fill="#334155">rule-based, or a scripted</text>
  <text x="451" y="207" text-anchor="middle" font-size="13" fill="#334155">stand-in for a model</text>
  <text x="451" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">no authority to act</text>
  <path d="M580 170H612" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="616" y="100" width="250" height="140" rx="14" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/></g>
  <text x="741" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1.5">3  THE DRY RUN</text>
  <text x="741" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Proof first</text>
  <text x="741" y="188" text-anchor="middle" font-size="13" fill="#334155">exact affected set, with</text>
  <text x="741" y="207" text-anchor="middle" font-size="13" fill="#334155">transitive dependents</text>
  <text x="741" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">simulated env, nothing changes</text>
  <path d="M870 170H902" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="906" y="100" width="250" height="140" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/></g>
  <text x="1031" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.5">4  THE VERIFIER</text>
  <text x="1031" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Decides</text>
  <text x="1031" y="188" text-anchor="middle" font-size="13" fill="#334155">blast radius + policy limits</text>
  <text x="1031" y="207" text-anchor="middle" font-size="13" fill="#334155">no LLM, no randomness</text>
  <text x="1031" y="228" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">same input, same verdict</text>
  <path d="M1031 244V288" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- ROW 2 -->
  <g filter="url(#sh)"><rect x="906" y="292" width="250" height="140" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/></g>
  <text x="1031" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.5">5  THE VERDICT</text>
  <rect x="926" y="332" width="210" height="26" rx="13" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1031" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">allow: go to execute</text>
  <rect x="926" y="364" width="210" height="26" rx="13" fill="#fef3c7" stroke="#d97706"/>
  <text x="1031" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">needs approval: ask a human</text>
  <rect x="926" y="396" width="210" height="26" rx="13" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1031" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">deny: stop, write nothing</text>
  <path d="M902 378H870" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="616" y="292" width="250" height="140" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/></g>
  <text x="741" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.5">6  THE HUMAN GATE</text>
  <text x="741" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">A second person</text>
  <text x="741" y="374" text-anchor="middle" font-size="13" fill="#334155">single-use, expires, bound to</text>
  <text x="741" y="392" text-anchor="middle" font-size="13" fill="#334155">the hash of the exact plan</text>
  <text x="741" y="418" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">no self-approval</text>
  <path d="M612 362H580" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="326" y="292" width="250" height="140" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/></g>
  <text x="451" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1.5">7  THE ACTION</text>
  <text x="451" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Re-verify, then write</text>
  <text x="451" y="374" text-anchor="middle" font-size="13" fill="#334155">idempotency key per write,</text>
  <text x="451" y="392" text-anchor="middle" font-size="13" fill="#334155">so a retry cannot repeat it</text>
  <text x="451" y="418" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">plan drift blocks the write</text>
  <path d="M322 362H290" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)"><rect x="36" y="292" width="250" height="140" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/></g>
  <text x="161" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.5">8  THE RECORD</text>
  <text x="161" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Ledger and audit</text>
  <text x="161" y="374" text-anchor="middle" font-size="13" fill="#334155">append-only effects ledger,</text>
  <text x="161" y="392" text-anchor="middle" font-size="13" fill="#334155">hash-chained audit log</text>
  <text x="161" y="418" text-anchor="middle" font-size="12" font-style="italic" fill="#64748b">tamper-evident</text>

  <!-- allow path bypassing the human gate -->
  <path d="M1031 436V470H451V436" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arr)"/>
  <rect x="640" y="456" width="360" height="28" rx="14" fill="#f8fafc"/>
  <text x="820" y="475" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">allow skips the human, but never skips re-verify</text>

  <!-- durability band -->
  <rect x="36" y="508" width="1120" height="76" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="596" y="538" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Durable: every transition is one SQLite transaction (state, checkpoint, audit record)</text>
  <text x="596" y="562" text-anchor="middle" font-size="13" fill="#78350f">Kill the process at any phase boundary, resume, and the ledger shows each write exactly once.</text>

  <text x="600" y="614" text-anchor="middle" font-size="12" fill="#64748b">Simulated environment and synthetic data. Crash matrix: 30 of 30 kill points matched an uninterrupted run (30 = 5 steps x 6 phases).</text>
</svg>
