<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Runbook Autopilot</title>
  <desc id="description">Runbooks that prove it before they touch it: dry-run proofs, a deterministic blast-radius verifier, a human approval gate and crash-safe resume, in a simulated environment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150f05"/>
      <stop offset="0.56" stop-color="#3a2a0a"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fcd34d" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f0a03" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="230" fill="url(#glow)"/>
  <g opacity=".2" fill="none" stroke="#fcd34d" stroke-width="1.2">
    <path d="M760 230h70v-60h60v40h70v-90h70v50h90"/>
    <g fill="#fcd34d" stroke="none"><circle cx="760" cy="230" r="5"/><circle cx="890" cy="210" r="5"/><circle cx="1020" cy="120" r="5"/><circle cx="1180" cy="170" r="5"/></g>
  </g>
  <g transform="translate(74 68)" filter="url(#shadow)">
    <rect width="88" height="88" rx="22" fill="#2b1f08" stroke="#fcd34d" stroke-opacity=".6"/>
    <g fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="26" y="20" width="36" height="48" rx="5"/>
      <path d="M36 20v-5h16v5"/>
      <path d="M33 34h8M33 45h8M33 56h8"/>
      <path d="M46 34l3 3 6-7M46 45l3 3 6-7"/>
      <path d="M46 56h9"/>
    </g>
  </g>
  <text x="190" y="118" fill="#fffbeb" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="700">Runbook Autopilot</text>
  <text x="190" y="162" fill="#fde68a" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="24">Runbooks that prove it before they touch it</text>
  <text x="74" y="250" fill="#fef3c7" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="20" opacity=".9">dry-run proofs  ·  deterministic verifier  ·  human approval gate  ·  crash-safe resume</text>
</svg>
